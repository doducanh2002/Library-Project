server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
  
  # Redis Configuration for Rate Limiting
  data:
    redis:
      host: localhost
      port: 6379
      password: # Add password if needed
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # Gateway Configuration
  cloud:
    gateway:
      # Global CORS Configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      # Route Configuration
      routes:
        # ================================
        # Authentication Service Routes
        # ================================
        
        # Public auth endpoints
        - id: auth-public-login
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                
        - id: auth-public-register
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/register
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                
        - id: auth-public-forgot-password
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/forgot-password,/api/v1/auth/reset-password
            - Method=POST
            
        - id: auth-public-otp
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/sendotp,/api/v1/auth/active
            - Method=POST
            
        - id: auth-public-jwk
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/jwk/token
            - Method=GET
            
        # Protected auth endpoints (USER level)
        - id: auth-user-profile
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/me,/api/v1/auth/change-password
          filters:
            - JwtAuthentication
            
        # Admin user management endpoints (ADMIN level)
        - id: auth-admin-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - JwtAuthentication
            
        # ================================
        # Library Backend Routes
        # ================================
        
        # Public catalog endpoints - Books
        - id: catalog-books-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/books,/api/v1/books/{id},/api/v1/books/isbn/{isbn},/api/v1/books/popular,/api/v1/books/category/{categoryId},/api/v1/books/author/{authorId},/api/v1/books/publisher/{publisherId}
            - Method=GET
            
        - id: catalog-books-search-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/books/search
            - Method=POST
            
        # Public catalog endpoints - Categories
        - id: catalog-categories-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/categories,/api/v1/categories/{categoryId},/api/v1/categories/active,/api/v1/categories/root,/api/v1/categories/slug/{slug},/api/v1/categories/{categoryId}/subcategories,/api/v1/categories/{categoryId}/hierarchy,/api/v1/categories/check-name,/api/v1/categories/check-slug
            - Method=GET
            
        # Public catalog endpoints - Authors
        - id: catalog-authors-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/authors,/api/v1/authors/{authorId},/api/v1/authors/search,/api/v1/authors/{authorId}/books,/api/v1/authors/name/{name},/api/v1/authors/nationality/{nationality},/api/v1/authors/prolific,/api/v1/authors/nationalities
            - Method=GET
            
        # Public catalog endpoints - Publishers
        - id: catalog-publishers-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/publishers,/api/v1/publishers/{publisherId},/api/v1/publishers/{publisherId}/books,/api/v1/publishers/search,/api/v1/publishers/established,/api/v1/publishers/active,/api/v1/publishers/check-name
            - Method=GET
            
        # Public catalog endpoints - Search
        - id: catalog-search-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/search/fulltext,/api/v1/search/categories,/api/v1/search/authors,/api/v1/search/available-for-loan,/api/v1/search/available-for-sale,/api/v1/search/recent,/api/v1/search/suggestions,/api/v1/search/popular-terms,/api/v1/search/filters/performance
            - Method=GET
            
        - id: catalog-search-advanced-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/search/advanced
            - Method=POST
            
        # Public catalog endpoints - Documents
        - id: catalog-documents-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/documents,/api/v1/documents/{id},/api/v1/documents/public,/api/v1/documents/book/{bookId},/api/v1/documents/{id}/download,/api/v1/documents/{id}/download-url,/api/v1/documents/{id}/view,/api/v1/documents/{id}/view-url,/api/v1/documents/popular
            - Method=GET
            
        - id: catalog-documents-search-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/documents/search
            - Method=POST
            
        # Public health endpoint
        - id: catalog-health-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/health
            - Method=GET
            
        # USER level endpoints
        - id: catalog-user-cart
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - JwtAuthentication
            
        - id: catalog-user-orders
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - JwtAuthentication
            
        - id: catalog-user-loans
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - JwtAuthentication
            
        - id: catalog-user-notifications
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - JwtAuthentication
            
        - id: catalog-user-documents
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/documents/{id}/view-url,/api/v1/documents/{id}/download-url
          filters:
            - JwtAuthentication
            
        # LIBRARIAN/ADMIN level endpoints
        - id: catalog-admin-all
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - JwtAuthentication
            
        # ================================
        # File Storage Service Routes
        # ================================
        
        # Public file service endpoints
        - id: file-health-public
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/files/health
            - Method=GET
        
        - id: file-upload
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/files/upload
            - Method=POST
          filters:
            - JwtAuthentication
            - name: RequestSize
              args:
                maxSize: 500MB
                
        - id: file-service-general
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/files/**
          filters:
            - JwtAuthentication

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      
# Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.library.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/api-gateway.log

# JWT Configuration
jwt:
  auth-service:
    jwk-url: http://localhost:8081/api/v1/auth/jwk/token